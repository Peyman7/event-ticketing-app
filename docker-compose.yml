services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    # Default max_connections (100) is enough for the 50-thread race tests.
    command: ["postgres", "-c", "max_connections=200"]
    ports: ["${DB_HOST_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing"]
      interval: 2s
      timeout: 3s
      retries: 20

  web:
    build: .
    env_file: .env
    volumes: [".:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

  worker:
    build: .
    env_file: .env
    volumes: [".:/app"]
    command: ["python", "manage.py", "procrastinate", "worker"]
    depends_on:
      db: {condition: service_healthy}

  locust:
    image: python:3.12-slim
    profiles: ["loadtest"]
    working_dir: /loadtest
    volumes: ["./loadtest:/loadtest"]
    entrypoint: ["sh", "-c", "pip install -q -r requirements.txt && exec locust \"$$@\"", "--"]
    depends_on: [web]

volumes:
  pgdata:
