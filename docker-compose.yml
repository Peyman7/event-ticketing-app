services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    # random_page_cost=1.1: SSD-appropriate planner cost (default 4 assumes spinning
    # disks and under-uses indexes; see docs/explain-analyze.md).
    command: ["postgres", "-c", "max_connections=200", "-c", "random_page_cost=1.1"]
    ports: ["${DB_HOST_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing"]
      interval: 2s
      timeout: 3s
      retries: 20

  web:
    build: .
    image: ticketing-app:dev
    env_file: .env
    volumes: [".:/app"]
    ports: ["8000:8000"]
    command: ["gunicorn", "config.wsgi:application", "-c", "gunicorn.conf.py"]
    depends_on:
      db: {condition: service_healthy}

  worker:
    image: ticketing-app:dev
    env_file: .env
    volumes: [".:/app"]
    command: ["python", "manage.py", "procrastinate", "worker"]
    depends_on:
      db: {condition: service_healthy}

  locust:
    image: python:3.12-slim
    profiles: ["loadtest"]
    working_dir: /loadtest
    volumes: ["./loadtest:/loadtest"]
    entrypoint: ["sh", "-c", "pip install -q -r requirements.txt && exec locust \"$$@\"", "--"]
    depends_on: [web]

volumes:
  pgdata:
